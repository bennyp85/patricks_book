<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/> 
    <title>Color & Number Selection</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }

        .main-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 120px);
            overflow: hidden;
        }

        .square {
            width: 100px;
            height: 100px;
            border-radius: 4px;
            position: absolute;
            cursor: pointer;
        }

        /* Positions for squares */
        .square-brown {
            top: 20px;
            left: 20px;
            background-color: #8B4513;
        }
        .square-lightblue {
            top: 140px;
            left: 20px;
            background-color: #ADD8E6;
        }
        .square-yellow {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #FFFF00;
        }
        .square-orange {
            top: 20px;
            right: 20px;
            background-color: #FFA500;
        }
        .square-darkblue {
            top: 140px;
            right: 20px;
            background-color: #00008B;
        }
        .square-red {
            top: 50%;
            left: 25%;
            transform: translate(-50%, -50%);
            background-color: #FF0000;
        }
        .square-green {
            bottom: 160px;
            left: 20px;
            background-color: #2eb72e;
        }
        .square-grey {
            bottom: 40px;
            left: 20px;
            background-color: #808080;
        }
        .square-purple {
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #800080;
        }
        .square-black {
            bottom: 40px;
            right: 20px;
            background-color: #000000;
        }

        .number {
            position: absolute;
            font-size: 65px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            display: none;
            /* Add padding to increase hit area */
            padding: 20px;
        }

        /* Show outline on hover to visualize the hit area */
        .number:hover {
            outline: 2px dashed #999;
        }

        .number1 {
            top: 20px;
            left: 20px;
        }
        .number2 {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
        .number3 {
            top: 20px;
            right: 20px;
        }
        .number4 {
            top: 50%;
            left: 25%;
            transform: translate(-50%, -50%);
        }
        .number5 {
            bottom: 40px;
            left: 20px;
        }
        .number6 {
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }
        .number7 {
            bottom: 40px;
            right: 20px;
        }

        .footer-section {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #f9f9f9;
            border-top: 1px solid #ddd;
            box-sizing: border-box;
            padding: 20px;
            height: 120px; 
            z-index: 9999;
        }

        .footer-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            height: 100%;
        }

        .history-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 10px 20px;
            border: 1px solid #0078D7;
            font-size: 28px;
            border-radius: 6px;
            background-color: #fff;
        }

        .history-item .color-square {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .button-group {
            display: flex;
            gap: 20px;
        }

        .delete-button,
        .clear-button {
            padding: 20px 40px;
            font-size: 24px;
            cursor: pointer;
            background-color: #0078D7;
            border: none;
            border-radius: 8px;
            color: #fff;
            transition: background-color 0.3s;
        }

        .delete-button:hover,
        .clear-button:hover {
            background-color: #005a9e;
        }

        .delete-button:focus,
        .clear-button:focus {
            outline: 4px solid #005a9e;
        }

        .chosen-color-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            text-align: center;
        }

        .chosen-color-square {
            width: 200px;
            height: 200px;
            border: 3px solid #333;
            border-radius: 10px;
        }

    </style>
</head>
<body>
    <div class="main-container">
        <!-- Color squares -->
        <div class="square square-brown" data-color="Brown"></div>
        <div class="square square-lightblue" data-color="Light Blue"></div>
        <div class="square square-yellow" data-color="Yellow"></div>
        <div class="square square-orange" data-color="Orange"></div>
        <div class="square square-darkblue" data-color="Dark Blue"></div>
        <div class="square square-red" data-color="Red"></div>
        <div class="square square-green" data-color="Green"></div>
        <div class="square square-grey" data-color="Grey"></div>
        <div class="square square-purple" data-color="Purple"></div>
        <div class="square square-black" data-color="Black"></div>

        <!-- Numbers -->
        <div class="number number1" data-number="1">1</div>
        <div class="number number2" data-number="2">2</div>
        <div class="number number3" data-number="3">3</div>
        <div class="number number4" data-number="4">4</div>
        <div class="number number5" data-number="5">5</div>
        <div class="number number6" data-number="6">6</div>
        <div class="number number7" data-number="7">7</div>

        <!-- Chosen colour display -->
        <div class="chosen-color-display" id="chosen-color-display">
            <div class="chosen-color-square" id="chosen-color-square"></div>
        </div>
    </div>

    <!-- History and Buttons Section -->
    <div class="footer-section">
        <div class="footer-content">
            <div class="history-items" id="history-items"></div>
            <div class="button-group">
                <button id="delete-button" class="delete-button" aria-label="Delete last entry or go back">Delete</button>
                <button id="clear-button" class="clear-button" aria-label="Clear all history">Clear</button>
            </div>
        </div>
    </div>

    <script>
        const colorMap = {
            "Red": "#FF0000",
            "Blue": "#0000FF",
            "Green": "#2eb72e",
            "Yellow": "#FFFF00",
            "Purple": "#800080",
            "Brown": "#8B4513",
            "Light Blue": "#ADD8E6",
            "Orange": "#FFA500",
            "Grey": "#808080",
            "Black": "#000000",
            "Dark Blue": "#00008B"
        };

        let selectedColour = null;
        let selectedNumber = null;
        let historyItems = [];

        const historyItemsContainer = document.getElementById('history-items');
        const deleteButton = document.getElementById('delete-button');
        const clearButton = document.getElementById('clear-button');

        const colorSquares = document.querySelectorAll('.square');
        const numbers = document.querySelectorAll('.number');

        const chosenColorDisplay = document.getElementById('chosen-color-display');
        const chosenColorSquare = document.getElementById('chosen-color-square');

        function showColors(show) {
            colorSquares.forEach(cs => {
                cs.style.display = show ? 'block' : 'none';
            });
        }

        function showNumbers(show) {
            numbers.forEach(num => {
                num.style.display = show ? 'block' : 'none';
            });
        }

        function showChosenColorDisplay(show, colour=null) {
            if (show && colour) {
                chosenColorSquare.style.backgroundColor = colorMap[colour];
                chosenColorDisplay.style.display = 'block';
            } else {
                chosenColorDisplay.style.display = 'none';
            }
        }

        function resetSelection() {
            selectedColour = null;
            selectedNumber = null;
        }

        // Initially show colors, hide numbers and chosen color display
        showColors(true);
        showNumbers(false);
        showChosenColorDisplay(false);

        // On color click
        colorSquares.forEach(square => {
            square.addEventListener('click', () => {
                resetSelection();
                selectedColour = square.getAttribute('data-color');
                showColors(false);
                showNumbers(true);
                showChosenColorDisplay(true, selectedColour);
            });
        });

        // On number click
        numbers.forEach(num => {
            num.addEventListener('click', () => {
                if (!selectedColour) {
                    alert("Please select a colour first.");
                    return;
                }
                selectedNumber = num.getAttribute('data-number');
                addToHistory(selectedColour, selectedNumber);
                resetSelection();
                showNumbers(false);
                showColors(true);
                showChosenColorDisplay(false);
            });
        });

        function addToHistory(colour, number) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'history-item';
            itemDiv.innerHTML = `
                <div class="color-square" style="background-color: ${colorMap[colour]}"></div>
                <span>${colour} ${number}</span>
            `;
            historyItemsContainer.appendChild(itemDiv);
            historyItems.push({ colour, number });
        }

        function removeLastHistoryItem() {
            if (historyItems.length === 0) return;
            const allItems = historyItemsContainer.querySelectorAll('.history-item');
            if (allItems.length > 0) {
                const lastItem = allItems[allItems.length - 1];
                historyItemsContainer.removeChild(lastItem);
                historyItems.pop();
            }
        }

        deleteButton.addEventListener('click', () => {
            if (selectedColour && !selectedNumber) {
                resetSelection();
                showNumbers(false);
                showColors(true);
                showChosenColorDisplay(false);
            } else {
                removeLastHistoryItem();
            }
        });

        clearButton.addEventListener('click', () => {
            historyItems = [];
            historyItemsContainer.innerHTML = '';
        });
    </script>
</body>
</html>

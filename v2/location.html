<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DVD Location</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="location-wrapper">
        <button class="home-button" onclick="window.location.href='index.html'">Home</button>
        
        <!-- DVD number container -->
        <div class="dvd-number-container" id="dvd-number-container">
            <div class="dvd-number" id="dvd-number"></div>
        </div>
        
        <div class="dvd-title-container" id="dvd-container">
            <div class="dvd-title" id="title">Loading...</div>
        </div>

        <!-- DVD location container -->
        <div class="dvd-location-container" id="location-container">
            <div class="dvd-location" id="location-display">Loading...</div>
        </div>

        <!-- DVD Bookcase container -->
        <div class="dvd-bookcase-container" id="bookcase-container">
            <div class="dvd-bookcase" id="bookcase">Loading...</div>
        </div>

        <!-- DVD Shelf container -->
        <div class="dvd-shelf-container" id="shelf-container">
            <div class="dvd-shelf" id="shelf">Loading...</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>

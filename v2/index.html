<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Eye tracking number selector interface">
    <title>Pat's DVDs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header class="site-header">
            <h1 class="main-title">Pat's DVDs</h1>
        </header>
        <!-- Number pad grid with additional control buttons -->
        <section class="number-grid">
            <!-- Top row -->
            <button class="number" data-value="0" aria-label="Zero">0</button>
            <button class="number" data-value="1" aria-label="One">1</button>
            <button class="number" data-value="2" aria-label="Two">2</button>
            <button class="number" data-value="3" aria-label="Three">3</button>
            <button class="number" data-value="4" aria-label="Four">4</button>
            <button class="number" data-value="5" aria-label="Five">5</button>
            
            <!-- Bottom row -->
            <button class="number" data-value="6" aria-label="Six">6</button>
            <button class="number" data-value="7" aria-label="Seven">7</button>
            <button class="number" data-value="8" aria-label="Eight">8</button>
            <button class="number" data-value="9" aria-label="Nine">9</button>
            <button id="greenBtn" aria-label="Green button">Green</button>
            <button id="sceneBtn" aria-label="Scene Selection">Scene</button>
        </section>

        <section class="bottom-section">
            <div class="history-container">
                <div id="dvdLabel" class="history-label">DVD</div>
                <div class="history-bar" id="dvdHistoryBar" aria-label="DVD input history"></div>
                <div class="button-container">
                    <button id="dvdDeleteBtn" aria-label="Delete last DVD entry">Delete</button>
                    <button id="dvdClearBtn" aria-label="Clear all DVD entries">Clear</button>
                </div>
            </div>
            <div class="history-container">
                <div id="sceneLabel" class="history-label">Scene</div>
                <div class="history-bar" id="sceneHistoryBar" aria-label="Scene input history"></div>
                <div class="button-container">
                    <button id="sceneDeleteBtn" aria-label="Delete last scene entry">Delete</button>
                    <button id="sceneClearBtn" aria-label="Clear all scene entries">Clear</button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>

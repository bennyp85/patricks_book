<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Eye tracking number selector interface">
    <title>Number Selector for Eye Tracking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <!-- Number pad grid with additional control buttons -->
        <section class="number-grid">
            <!-- Top row -->
            <button class="number" data-value="0" aria-label="Zero">0</button>
            <button class="number" data-value="1" aria-label="One">1</button>
            <button class="number" data-value="2" aria-label="Two">2</button>
            <button class="number" data-value="3" aria-label="Three">3</button>
            <button class="number" data-value="4" aria-label="Four">4</button>
            <button class="number" data-value="5" aria-label="Five">5</button>
            
            <!-- Bottom row -->
            <button class="number" data-value="6" aria-label="Six">6</button>
            <button class="number" data-value="7" aria-label="Seven">7</button>
            <button class="number" data-value="8" aria-label="Eight">8</button>
            <button class="number" data-value="9" aria-label="Nine">9</button>
            <button id="greenBtn" aria-label="Green button">Green</button>
            <button id="sceneBtn" aria-label="Scene Selection">Scene</button>
        </section>

        <!-- Bottom control section -->
        <section class="bottom-section">
            <div class="control-buttons">
                <button id="deleteBtn" aria-label="Delete last entry">Delete</button>
                <button id="clearBtn" aria-label="Clear all entries">Clear</button>
            </div>
            <div class="history-bar" id="historyBar" aria-label="Input history"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
